name: Publish reading site and SelfRef mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '50 15 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: science
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ppchanning/agent-environments-and-evaluation
          path: simulation
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Build existing reading site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./science
          destination: ./_site
      - name: Build and verify SelfRef mirror
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/_site"
          npm ci --prefix science/site/selfref --ignore-scripts --no-audit --no-fund
          node science/site/selfref/build.mjs --science="$GITHUB_WORKSPACE/science" --simulation="$GITHUB_WORKSPACE/simulation" --output="$GITHUB_WORKSPACE/_site/library" --base=https://ppchanning.github.io/ai4science-observatory/library/
          python3 science/site/selfref/verify.py "$GITHUB_WORKSPACE/_site/library"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
